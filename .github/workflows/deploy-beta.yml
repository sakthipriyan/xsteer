name: Deploy Beta

# Every merge to main goes live on beta.xsteer.in. Production only moves on a tag,
# so main is always safe to merge into.
#
# Beta means main and nothing else — `cargo xtask release` treats a green run here
# as proof that the commit it is about to tag was really deployed. Branch previews
# belong on dev.xsteer.in, which is why the dispatch path below refuses any other
# ref rather than quietly letting a branch take beta's place.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-beta
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to beta.xsteer.in
    runs-on: ubuntu-latest
    environment:
      name: beta
      url: https://beta.xsteer.in
    steps:
      - name: Refuse a dispatch against anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Beta serves main. Use dev.xsteer.in (cargo xtask dev) for ${{ github.ref_name }}."
          exit 1

      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build site
        working-directory: web
        env:
          DEPLOY_ENV: beta
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env beta
