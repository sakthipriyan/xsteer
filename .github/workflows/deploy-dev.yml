name: Deploy Dev

# dev.xsteer.in previews whatever branch you point it at, so it is dispatch-only:
# there is no branch whose pushes should automatically claim it. `cargo xtask dev`
# is the usual way in.
on:
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to dev.xsteer.in
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      url: https://dev.xsteer.in
      wrangler_command: deploy --env dev
    secrets: inherit
