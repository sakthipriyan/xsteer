name: Deploy Dev

# dev.xsteer.in previews whatever branch you point it at, so it is dispatch-only:
# there is no branch whose pushes should automatically claim it. `cargo xtask dev`
# is the usual way in.
on:
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to dev.xsteer.in
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.xsteer.in
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build site
        working-directory: web
        env:
          DEPLOY_ENV: dev
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env dev
