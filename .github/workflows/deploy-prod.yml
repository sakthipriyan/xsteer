name: Deploy Prod

# Production only ever serves a tag. Pushing one releases it; running this
# workflow from main with a tag rolls back to it. There is no path that puts a
# branch on xsteer.in.
#
# The rollback is dispatched from main on purpose. workflow_dispatch resolves
# the workflow file from the ref it is given, so dispatching the tag itself
# would run that tag's frozen copy of this workflow -- guards and all -- rather
# than the one here. Only the code being built comes from the tag.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to roll back to, e.g. v0.2.4
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify_ref:
    name: Verify the ref
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Refuse a dispatch against anything but main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "Run this from main and name the tag to roll back to."
          echo "Dispatching the tag itself would run that tag's copy of this workflow."
          echo "Refusing $REF_NAME."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A push is already filtered to v*.*.* by the trigger; a dispatch carries
      # the tag as an input, which nothing has validated yet.
      - name: Resolve and check the tag
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = "push" ]; then
            TAG="$PUSHED_TAG"
          else
            TAG="$INPUT_TAG"
          fi

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: '$TAG' is not a v*.*.* version tag."
            exit 1
          fi

          git fetch --quiet origin main "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
          if ! git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "Error: tag $TAG does not exist."
            exit 1
          fi

          SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          if ! git branch -r --contains "$SHA" | grep -E -q '(^|\s)origin/main$'; then
            echo "Error: tag $TAG is not on the main branch."
            exit 1
          fi

          echo "Deploying $TAG ($SHA)."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to xsteer.in
    needs: [verify_ref]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      url: https://xsteer.in
      wrangler_command: deploy
      ref: ${{ needs.verify_ref.outputs.tag }}
    secrets: inherit
