name: Deploy Prod

# Production deploys are deliberate: a version tag, or a manual run.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Both guards live in one job that always runs and fails from inside a step.
  # The tag check used to be a job gated by `if`, which meant a skipped job on
  # the manual path and an `always()` conditional on the deploy to work around
  # it; a step-level `if` needs neither.
  verify_ref:
    name: Verify the ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse a dispatch against anything but main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Production deploys from a v*.*.* tag, or manually from main."
          echo "Refusing ${{ github.ref_name }}."
          exit 1

      - name: Check tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          if ! git branch -r --contains ${{ github.sha }} | grep -E -q '(^|\s)origin/main$'; then
            echo "Error: tag ${{ github.ref_name }} is not on the main branch."
            exit 1
          fi

  deploy:
    name: Deploy to xsteer.in
    needs: [verify_ref]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      url: https://xsteer.in
      wrangler_command: deploy
    secrets: inherit
