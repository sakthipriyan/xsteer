[workspace]
resolver = "2"
members = ["core", "wasm", "xtask"]

[workspace.package]
version = "0.2.5"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sakthipriyan/xsteer"
homepage = "https://xsteer.dev"
description = "Privacy-first cashflow planner: statements in, a month's money to-do list out"
keywords = ["finance", "cashflow", "planner", "india", "wasm"]
categories = ["finance", "wasm"]

[workspace.dependencies]
xfina = "0.4.1"
xfingine = "0.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.42", features = ["serde", "serde-with-str"] }
regex = "1.10"
thiserror = "2.0"
blake3 = "1.5"
wasm-bindgen = "0.2"
