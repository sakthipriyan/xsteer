<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://xsteer.in/" />

    <title>Xsteer — your statements in, a month's money to-do list out</title>
    <meta
      name="description"
      content="Xsteer reads your bank, credit card, mutual fund and brokerage statements and tells you exactly what to move where this month. Runs entirely in your browser."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://xsteer.in/" />
    <meta property="og:title" content="Xsteer — your statements in, a month's money to-do list out" />
    <meta
      property="og:description"
      content="Salary, expenses, credit card dues and investment splits, planned for you. Entirely in your browser."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Runs before first paint, so a dark-mode visitor never sees a white flash. The
      // module bundle is deferred and would land too late to prevent it. An explicit
      // choice from the toggle wins; without one the OS preference decides.
      // Key kept in step with src/components/ThemeToggle.vue.
      try {
        var stored = localStorage.getItem('xsteer-theme')
        if (
          stored === 'dark' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {
        /* storage unavailable — fall through to the light default */
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
